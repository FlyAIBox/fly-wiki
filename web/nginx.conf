server {
    listen 80;
    server_name _;

    # Resolve the API container on every Docker DNS TTL. Using a variable keeps
    # Nginx startable while api is unavailable and follows api container IP
    # changes after a recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for all non-file routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and health to the backend.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
