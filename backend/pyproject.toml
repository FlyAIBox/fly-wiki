[project]
name = "flywiki"
version = "0.1.0"
description = "Evidence-first, self-hosted LLM Wiki"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5",
  "celery[redis]>=5.5,<6",
  "deepagents>=0.7,<0.8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=1.4,<2",
  "langfuse>=3,<4",
  "markdownify>=1.2,<2",
  "minio>=7.2,<8",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "asgi-lifespan>=2.1,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flywiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

