# FlyWiki 单命令自托管编排。
#
#   docker compose up -d                      # 核心骨架：Postgres + Redis + MinIO + API + Worker + Web
#   docker compose --profile observability up # 追加自托管 Langfuse（M0 观测/评估面）
#   docker compose --profile openkb up        # 追加固定版本 OpenKB 编译 Worker（镜像就绪后启用）
#
# M0 纪律：镜像固定到补丁版本，生产加固时再补 digest；不使用浮动 `latest`。
# 所有密钥来自 .env（见 .env.example），不写入镜像或版本库。

name: flywiki

x-backend-env: &backend-env
  FLYWIKI_ENVIRONMENT: ${FLYWIKI_ENVIRONMENT:-production}
  FLYWIKI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flywiki}:${POSTGRES_PASSWORD:-flywiki}@postgres:5432/${POSTGRES_DB:-flywiki}
  FLYWIKI_REDIS_URL: redis://redis:6379/0
  FLYWIKI_MINIO_HEALTH_URL: http://minio:9000/minio/health/live
  FLYWIKI_MINIO_ENDPOINT: minio:9000
  FLYWIKI_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-flywiki}
  FLYWIKI_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-flywiki-minio}
  FLYWIKI_MINIO_SECURE: "false"
  FLYWIKI_SOURCE_BUCKET: ${FLYWIKI_BUCKET:-flywiki-sources}
  FLYWIKI_LANGFUSE_HEALTH_URL: ${FLYWIKI_LANGFUSE_HEALTH_URL:-http://langfuse-web:3000/api/public/health}
  FLYWIKI_LANGFUSE_HOST: ${FLYWIKI_LANGFUSE_HOST:-http://langfuse-web:3000}
  FLYWIKI_OBSERVABILITY_BACKEND: ${FLYWIKI_OBSERVABILITY_BACKEND:-noop}
  FLYWIKI_LANGFUSE_PUBLIC_KEY: ${FLYWIKI_LANGFUSE_PUBLIC_KEY:-}
  FLYWIKI_LANGFUSE_SECRET_KEY: ${FLYWIKI_LANGFUSE_SECRET_KEY:-}
  FLYWIKI_AGENT_MODEL: ${FLYWIKI_AGENT_MODEL:-}
  FLYWIKI_AGENT_REACH_SKILL_PATH: /srv/skills/agent-reach
  FLYWIKI_WEB_CONTENT_FETCHER_SKILL_PATH: skills/web-content-fetcher
  MODEL_NAME: ${MODEL_NAME:-gpt-5-mini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flywiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flywiki}
      POSTGRES_DB: ${POSTGRES_DB:-flywiki}
    # Langfuse 复用同一 Postgres 实例的独立数据库。
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flywiki} -d ${POSTGRES_DB:-flywiki}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flywiki}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flywiki-minio}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # 一次性创建对象存储桶，然后退出。
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-flywiki}" "${MINIO_ROOT_PASSWORD:-flywiki-minio}" &&
        mc mb --ignore-existing local/${FLYWIKI_BUCKET:-flywiki-sources} &&
        mc mb --ignore-existing local/${LANGFUSE_BUCKET:-langfuse} &&
        echo "buckets ready"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: flywiki/api:0.1.0
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: flywiki/api:0.1.0
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *backend-env
      # Worker 不做启动引导；由 API 负责迁移与默认上下文。
      FLYWIKI_BOOTSTRAP_ON_START: "false"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: flywiki/web:0.1.0
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # --- 观测面（M0 必选，profile 控制以保持核心骨架轻量）--------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.4.13-alpine
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse-clickhouse}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  langfuse-worker:
    image: langfuse/langfuse-worker:3.30.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-flywiki}:${POSTGRES_PASSWORD:-flywiki}@postgres:5432/${LANGFUSE_DB:-langfuse}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse-clickhouse}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-flywiki}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-flywiki-minio}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto

  langfuse-web:
    image: langfuse/langfuse:3.30.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      langfuse-worker:
        condition: service_started
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"

  # --- OpenKB 编译 Worker（M0 目标；镜像就绪后启用）------------------------
  # OpenKB 以隔离、固定版本、可替换的方式运行，只经 OpenKBAdapter 调用；
  # 业务代码不 import OpenKB 或 OpenAI Agents SDK（ADR-0001）。
  # 镜像坐标待 OpenKB 打包后填入并固定版本 + digest。
  openkb-worker:
    image: ${OPENKB_IMAGE:-flywiki/openkb-worker:0.0.0-placeholder}
    profiles: ["openkb"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      OPENKB_REDIS_URL: redis://redis:6379/1

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clickhouse-data:
